name: coverage-campaign

# Manual run of the Phase 2 coverage campaign (docs/PHASE2_PREREGISTRATION.md).
# Hosted runners have 4 cores and a 6 h job limit: select a tier and/or a cell regex,
# and re-run the same selection to resume (results are uploaded as artifacts).

on:
  workflow_dispatch:
    inputs:
      grid:
        description: "Grid: frozen JSON path, or 'smoke'"
        required: true
        default: "validation/configs/coverage/primary_grid.json"
      tier:
        description: "Tier to run (1, 2, 3, 4, 9) or 'all'"
        required: true
        default: "1"
      select:
        description: "Optional regex on cell id (e.g. '^uvvis-11zero-8-')"
        required: false
        default: ""
      n_rep:
        description: "Optional override of N per cell (empty = pre-registered N)"
        required: false
        default: ""

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies (constrained)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_qt.txt -r requirements-dev.txt -c constraints.txt
          python -m pip freeze > campaign-env.txt

      - name: Run campaign
        env:
          GRID: ${{ github.event.inputs.grid }}
          TIER: ${{ github.event.inputs.tier }}
          SELECT: ${{ github.event.inputs.select }}
          NREP: ${{ github.event.inputs.n_rep }}
        run: |
          args=(run "$GRID" campaign-out --workers "$(nproc)")
          if [[ "$TIER" != "all" ]]; then args+=(--tier "$TIER"); fi
          if [[ -n "$SELECT" ]]; then args+=(--select "$SELECT"); fi
          if [[ -n "$NREP" ]]; then args+=(--n-rep "$NREP"); fi
          python -m validation.coverage_campaign "${args[@]}"

      - name: Summarize
        if: always()
        run: |
          python -m validation.coverage_campaign summarize campaign-out --csv campaign-out/summary.csv
          cp campaign-env.txt campaign-out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-campaign-${{ github.run_id }}
          path: campaign-out/
