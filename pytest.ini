[pytest]
testpaths = tests hmfit
addopts = -m "not slow"
markers =
    slow_validation_smoke: short production-backed validation harness smoke test
    slow: long-running validation (full coverage campaign); deselected by default, run with -m slow
    campaign_smoke: small Monte Carlo subset of the coverage campaign that runs on every push (< 3 min)
    gui: test drives Qt/PySide6 widgets (auto-applied by conftest.py to modules that import the GUI)
